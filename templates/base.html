<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NILE AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Georgia,'Times New Roman',serif}.page{min-height:100vh;padding-bottom:92px}
a{text-decoration:none;color:inherit}.top{height:58px;background:#000;border-bottom:1px solid #151515;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:27px;font-weight:bold}
.logo{width:62px;height:62px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 18px #8be51a;margin:auto}
.container{padding:14px}.card,.panel{background:#080f17;border:1px solid #8be51a;border-radius:18px;box-shadow:0 0 13px #8be51a;padding:18px;margin:14px 0}
.btn{display:block;width:100%;height:58px;padding:14px;border:2px solid #08bdf5;border-radius:13px;background:#000;color:#08bdf5;font:700 18px Georgia;box-shadow:0 0 8px #08bdf5;margin:11px 0;text-align:center}
input,select,textarea{width:100%;height:58px;padding:12px 16px;margin:7px 0;border-radius:13px;border:1.5px solid #aaa;background:#000;color:#ddd;font:16px Georgia}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;color:#111;border-radius:9px;text-align:center;padding:14px;font-size:21px}.stat small{display:block;background:linear-gradient(90deg,#18b8ef,#83a993);color:#fff;padding:8px;margin:10px -14px -14px}
.nav{position:fixed;bottom:0;left:0;right:0;height:82px;background:#000;border-top:1px solid #08bdf5;box-shadow:0 -3px 14px rgba(8,189,245,.20);display:grid;grid-template-columns:repeat(6,1fr);z-index:30}.nav a{text-align:center;padding-top:6px;font-size:13px;color:#fff;text-decoration:none}.nav b{display:block;font-size:29px;line-height:34px;font-weight:normal}.active{color:#08bdf5}
.hero{height:355px;background:linear-gradient(#13bfe455,#0087ff22),radial-gradient(circle at 50% 15%,#069bd8,#03121b 65%);display:flex;align-items:flex-end;padding:18px;font-size:25px;color:#8be51a}
.product{display:grid;grid-template-columns:38% 62%;background:#080f17;border:1px solid #8be51a;border-radius:18px;box-shadow:0 0 13px #8be51a;margin:14px 0;overflow:hidden}.product .pic{min-height:210px;background:linear-gradient(135deg,#e5edf4,#34414b 55%,#080f17);position:relative}.product .pic:after{content:'NILE AI';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#111;font-size:23px;font-weight:bold}.product .info{padding:12px;font-size:17px;line-height:1.65}.title{color:#8be51a;font-size:23px;font-weight:bold}
.auth{max-width:480px;margin:45px auto;padding:16px;text-align:center}.auth h1{font-size:38px;margin:18px 0 28px}.auth .logo{margin:auto}.message{background:#444;border-radius:10px;padding:20px;margin:15px 0;font-size:19px}
.vip{padding:24px;border-radius:24px;margin:16px 0;font-size:19px;background:#eee;color:#111}.vip:nth-child(even){background:#5d5d5d;color:#fff}.vip strong{float:right}
.green{color:#8be51a}.cyan{color:#16d9ff}.muted{color:#aaa}
@media(max-width:600px){.auth{margin:40px auto}.product .pic{min-height:220px}}
</style></head><body><div class="page">{% block content %}{% endblock %}</div>
<nav class="nav">
<a href="{{url_for('home')}}" class="{% if request.path=='/' or request.path=='/home' %}active{% endif %}"><b>⌂</b>Home</a>
<a href="/vip-task" class="{% if request.path=='/vip-task' %}active{% endif %}"><b>▣</b>Raffle</a>
<a href="/chat" class="{% if request.path=='/chat' %}active{% endif %}"><b>▤</b>chats</a>
<a href="{{url_for('products')}}" class="{% if request.path=='/products' or '/product/' in request.path %}active{% endif %}"><b>▦</b>AI</a>
<a href="{{url_for('income')}}" class="{% if request.path=='/income' %}active{% endif %}"><b>₿</b>Income</a>
<a href="{{url_for('my')}}" class="{% if request.path=='/my' %}active{% endif %}"><b>♙</b>My</a>
</nav></body></html>
