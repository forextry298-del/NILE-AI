<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NILE AI</title><link rel="stylesheet" href="{{ url_for("static",filename="css/nile.css") }}"></head><body>
<canvas id="live-dots"></canvas>
<style>
#live-dots{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  background:#020812;
}
body{
  background:#020812!important;
}
body > *{
  position:relative;
  z-index:1;
}
</style>
<script>
(function(){
  const c=document.getElementById("live-dots");
  if(!c)return;
  const ctx=c.getContext("2d");
  let w=0,h=0,dpr=1;
  let dots=[];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth;
    h=innerHeight;
    c.width=w*dpr;
    c.height=h*dpr;
    c.style.width=w+"px";
    c.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);

    dots=[];
    const count=Math.min(900,Math.max(450,Math.floor(w*h/650)));

    for(let i=0;i<count;i++){
      dots.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:.7+Math.random()*.5,
        vx:(Math.random()-.5)*.16,
        vy:(Math.random()-.5)*.16
      });
    }
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    // Clean, small white dots
    for(const d of dots){
      d.x+=d.vx;
      d.y+=d.vy;

      if(d.x<0)d.x=w;
      if(d.x>w)d.x=0;
      if(d.y<0)d.y=h;
      if(d.y>h)d.y=0;

      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,.75)";
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  addEventListener("resize",resize);
  resize();
  draw();
})();
