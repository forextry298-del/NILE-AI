<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NILE AI</title><link rel="stylesheet" href="{{ url_for("static",filename="css/nile.css") }}"><link rel="stylesheet" href="{{ url_for("static",filename="css/codex-background.css") }}"><link rel="stylesheet" href="{{ url_for("static",filename="css/codex-colors.css") }}">












<style id="nile-black-dots-only">
html, body, body::before, body::after {
  background-color: #000 !important;
  background-image: radial-gradient(circle, rgba(8,207,255,.42) 1.4px, transparent 1.6px) !important;
  background-size: 22px 22px !important;
  background-position: 0 0 !important;
  background-attachment: fixed !important;
}
.codex-green-waves, .green-wave, .wave-layer,
.ai-live-hero::after {
  display: none !important;
  animation: none !important;
  background-image: none !important;
  content: none !important;
}
</style>
</head><body>
<div class="codex-lightning-bg" aria-hidden="true">
<div class="flash"></div>
<div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
<div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
<div class="flash"></div><div class="flash"></div>
</div>












</div>
<main>
{% with notices = get_flashed_messages(with_categories=true) %}
  {% for category, message in notices %}
    <div class="nile-flash {{ category }}" role="status"
         style="margin:10px;padding:12px;border-radius:8px;background:#10252d;color:#fff;border:1px solid #00cfff;">
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>{% if request.path not in ['/login', '/register', '/registration', '/signup'] %}
<nav class="bottom nile-six-nav" aria-label="Main navigation"><a href="/home" class="nile-nav-item{% if request.path == '/home' or ('/home' == '/home' and request.path == '/') %} active{% endif %}" aria-label="Home"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5 M5.5 9v11h13V9 M9 20v-6h6v6"/></svg><span>Home</span></a><a href="/raffle" class="nile-nav-item{% if request.path == '/raffle' or ('/raffle' == '/home' and request.path == '/') %} active{% endif %}" aria-label="Raffle"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></svg><span>Raffle</span></a><a href="/support" class="nile-nav-item{% if request.path == '/support' or ('/support' == '/home' and request.path == '/') %} active{% endif %}" aria-label="chats"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.5 7.5L3 21l1.8-5.1A8.5 8.5 0 1 1 21 11.5z M8 11h.01 M12 11h.01 M16 11h.01"/></svg><span>chats</span></a><a href="/invest" class="nile-nav-item{% if request.path == '/invest' or ('/invest' == '/home' and request.path == '/') %} active{% endif %}" aria-label="AI"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M18.4 5.6l-2.1 2.1 M7.7 16.3l-2.1 2.1 M8 8h8v8H8z M10 11h4 M10 13h4"/></svg><span>AI</span></a><a href="/income" class="nile-nav-item{% if request.path == '/income' or ('/income' == '/home' and request.path == '/') %} active{% endif %}" aria-label="Income"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20 M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>Income</span></a><a href="/my" class="nile-nav-item{% if request.path == '/my' or ('/my' == '/home' and request.path == '/') %} active{% endif %}" aria-label="My"><svg class="nile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"/></svg><span>My</span></a></nav>
{% endif %}<script src="{{ url_for("static",filename="js/nile.js") }}"></script></body></html>
