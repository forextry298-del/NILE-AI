<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NILE AI</title><link rel="stylesheet" href="{{ url_for("static",filename="css/nile.css") }}"></head><body>
<canvas id="live-dots"></canvas>
<style>
#live-dots{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  background:#020812;
}
body{
  background:#020812!important;
}
body > *{
  position:relative;
  z-index:1;
}
</style>
<script>
(function(){
  const c=document.getElementById("live-dots");
  if(!c)return;
  const ctx=c.getContext("2d");
  let w=0,h=0,dpr=1;
  const flies=[];

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2);
    w=innerWidth;
    h=innerHeight;
    c.width=w*dpr;
    c.height=h*dpr;
    c.style.width=w+"px";
    c.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);

    if(!flies.length){
      const count=Math.min(650,Math.max(350,Math.floor(w*h/1040)));
      for(let i=0;i<count;i++){
        flies.push({
          x:Math.random()*w,
          y:Math.random()*h,
          vx:(Math.random()-.5)*.22,
          vy:(Math.random()-.5)*.22,
          r:.7+Math.random()*1.5,
          phase:Math.random()*Math.PI*2,
          speed:.7+Math.random()*1.8
        });
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,w,h);

    /* scanning wave */
    const scanY=((Date.now()/18)%(h+160))-80;
    const glow=ctx.createLinearGradient(0,scanY-55,0,scanY+55);
    glow.addColorStop(0,"rgba(0,220,255,0)");
    glow.addColorStop(.5,"rgba(255,255,255,.20)");
    glow.addColorStop(1,"rgba(0,220,255,0)");
    ctx.save();
    ctx.globalCompositeOperation="screen";
    ctx.fillStyle=glow;
    ctx.fillRect(0,scanY-55,w,110);

    ctx.beginPath();
    ctx.moveTo(0,scanY);
    ctx.lineTo(w,scanY);
    ctx.strokeStyle="rgba(255,255,255,.32)";
    ctx.lineWidth=1;
    ctx.stroke();

    for(const f of flies){
      f.phase+=.018*f.speed;
      f.x+=f.vx+Math.sin(f.phase*.7)*.12;
      f.y+=f.vy+Math.cos(f.phase*.55)*.10;

      if(f.x<-5)f.x=w+5;
      if(f.x>w+5)f.x=-5;
      if(f.y<-5)f.y=h+5;
      if(f.y>h+5)f.y=-5;

      const glow=.35+.65*(Math.sin(f.phase)+1)/2;
      const radius=f.r*(1+glow*.7);

      ctx.beginPath();
      ctx.arc(f.x,f.y,radius*3.2,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.025+.035*glow})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(f.x,f.y,radius,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${.45+.5*glow})`;
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  addEventListener("resize",resize);
  resize();
  draw();
})();
