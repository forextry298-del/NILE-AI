<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NILE AI</title><link rel="stylesheet" href="{{ url_for("static",filename="css/nile.css") }}"><link rel="stylesheet" href="{{ url_for("static",filename="css/codex-background.css") }}"><link rel="stylesheet" href="{{ url_for("static",filename="css/codex-colors.css") }}"></head><body>
<div class="codex-lightning-bg" aria-hidden="true">
<div class="flash"></div>
<div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
<div class="bolt"></div><div class="bolt"></div><div class="bolt"></div><div class="bolt"></div>
<div class="flash"></div><div class="flash"></div>
</div>
<div class="codex-green-waves" aria-hidden="true">
<div class="green-wave wave-1"></div>
<div class="green-wave wave-2"></div>
<div class="green-wave wave-3"></div>
<div class="green-wave wave-4"></div>
<div class="green-wave wave-5"></div>
<div class="green-wave wave-6"></div>
<div class="green-wave wave-7"></div>
<div class="green-wave wave-8"></div>
<div class="green-wave wave-9"></div>
<div class="green-wave wave-10"></div>
<div class="green-wave wave-11"></div>
<div class="green-wave wave-12"></div>
</div>
<main>
{% with notices = get_flashed_messages(with_categories=true) %}
  {% for category, message in notices %}
    <div class="nile-flash {{ category }}" role="status"
         style="margin:10px;padding:12px;border-radius:8px;background:#10252d;color:#fff;border:1px solid #00cfff;">
      {{ message }}
    </div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main><nav class="bottom"><a href="/home"><span class="nav-icon">⌂</span><small>Home</small></a><a href="/invest"><span class="nav-icon">◇</span><small>AI</small></a><a class="wallet-nav" href="/wallet"><span class="wallet-icon">◉</span><small>Wallet</small></a><a href="/income"><span class="nav-icon">◌</span><small>Activity</small></a><a href="/my"><span class="nav-icon">◉</span><small>My</small></a></nav><script src="{{ url_for("static",filename="js/nile.js") }}"></script></body></html>
