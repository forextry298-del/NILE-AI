{% extends "base.html" %}
{% block content %}

<div class="invite-screen">

  <header class="invite-header">
    <a href="/my" class="back-btn">←</a>
    <h1>Invite Friends</h1>
  </header>

  <div class="invite-card">

    <h2>Invitation link</h2>

    <div class="invite-link" id="inviteLink">
      {{ request.url_root.rstrip('/') }}/register?ref={{ user.invite_code }}
    </div>

    <div class="invite-buttons">
      <button onclick="copyInvite()">▣ &nbsp; Copy link</button>
      <button class="share-btn" onclick="shareInvite()">♧ &nbsp; Share</button>
    </div>

  </div>

  <div class="invite-card qr-card">

    <h2>Scan to register</h2>

    <div class="qr-box">
      <img
        id="inviteQR"
        src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data={{ (request.url_root.rstrip('/') ~ '/register?ref=' ~ user.invite_code)|urlencode }}"
        alt="Registration QR Code">
    </div>

    <p>
      Friends scan this code with their phone camera to open your
      registration link.
    </p>

    <div class="invite-buttons">
      <button onclick="saveQR()">⇩ &nbsp; Save QR</button>
      <button onclick="shareInvite()">♧ &nbsp; Share link</button>
    </div>

  </div>

</div>

<style>
.invite-screen{
  min-height:100vh;
  box-sizing:border-box;
  padding:8px 7px 85px;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,210,255,.12),transparent 30%),
    radial-gradient(circle at 80% 45%,rgba(0,130,255,.08),transparent 30%),
    #020812;
}

.invite-header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  border-bottom:1px solid #07566b;
  margin-bottom:9px;
}

.invite-header h1{
  margin:0;
  color:#08BDEA;
  font-size:19px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 0 8px rgba(0,220,255,.35);
}

.back-btn{
  position:absolute;
  left:2px;
  top:7px;
  width:40px;
  height:40px;
  border:1px solid #00d9ff;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#08BDEA;
  text-decoration:none;
  font-family:Arial,sans-serif;
  font-size:29px;
  box-shadow:0 0 12px rgba(0,220,255,.25);
}

.invite-card{
  max-width:520px;
  margin:9px auto;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #08738b;
  border-radius:12px;
  background:rgba(3,17,29,.92);
  box-shadow:inset 0 0 14px #031b27;
}

.invite-card h2{
  margin:0 0 9px;
  color:#08BDEA;
  font-size:14px;
  font-weight:900;
}

.invite-link{
  min-height:48px;
  padding:9px;
  box-sizing:border-box;
  border:1px solid #07566b;
  border-radius:8px;
  background:#071018;
  color:#dcebef;
  font-family:monospace;
  font-size:11px;
  line-height:1.35;
  overflow-wrap:anywhere;
  display:flex;
  align-items:center;
}

.invite-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.invite-buttons button{
  min-height:42px;
  border:1px solid #00dfff;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-family:Arial,sans-serif;
  font-size:12px;
  font-weight:800;
  box-shadow:0 0 8px rgba(0,220,255,.12);
}

.invite-buttons .share-btn{
  background:#04aeda;
  border-color:#00dfff;
  box-shadow:0 0 12px rgba(0,220,255,.25);
}

.qr-card{
  text-align:center;
}

.qr-card h2{
  text-align:center;
}

.qr-box{
  width:220px;
  max-width:75%;
  margin:12px auto;
  padding:10px;
  box-sizing:border-box;
  background:#fff;
  border-radius:16px;
}

.qr-box img{
  display:block;
  width:100%;
  height:auto;
}

.qr-card p{
  max-width:390px;
  margin:10px auto 3px;
  color:#9eb1ba;
  font-size:10px;
  line-height:1.4;
}

@media(max-width:390px){
  .invite-screen{
    padding-left:6px;
    padding-right:6px;
  }

  .invite-header{
    height:55px;
  }

  .invite-header h1{
    font-size:17px;
  }

  .back-btn{
    width:38px;
    height:38px;
    top:7px;
    font-size:27px;
  }

  .invite-card{
    margin:8px auto;
    padding:11px;
    border-radius:11px;
  }

  .invite-card h2{
    font-size:13px;
  }

  .invite-link{
    min-height:45px;
    font-size:10px;
  }

  .invite-buttons{
    gap:6px;
  }

  .invite-buttons button{
    min-height:39px;
    font-size:11px;
    border-radius:9px;
  }

  .qr-box{
    width:190px;
    max-width:70%;
    padding:8px;
    border-radius:13px;
  }

  .qr-card p{
    font-size:9px;
  }
}
</style>

<script>
function getInviteLink(){
  return document.getElementById("inviteLink").innerText.trim();
}

function copyInvite(){
  const link = getInviteLink();

  navigator.clipboard.writeText(link).then(function(){
    alert("Invitation link copied!");
  }).catch(function(){
    alert("Copy failed. Please copy the link manually.");
  });
}

function shareInvite(){
  const link = getInviteLink();

  if(navigator.share){
    navigator.share({
      title:"Invite Friends",
      text:"Join NILE AI using my invitation link:",
      url:link
    });
  }else{
    copyInvite();
  }
}

function saveQR(){
  const img = document.getElementById("inviteQR");

  const a = document.createElement("a");
  a.href = img.src;
  a.download = "NILE-AI-Invite-QR.png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>

{% endblock %}
<style>
.invite-screen{
  padding:7px 6px 75px;
}

.invite-header{
  height:58px;
}

.invite-header h1{
  font-size:20px;
}

.back-btn{
  width:46px;
  height:46px;
  top:5px;
  left:4px;
  border-radius:13px;
  font-size:30px;
  border-width:1px;
}

.invite-card{
  max-width:360px;
  margin:14px auto;
  padding:15px 12px;
  border-width:1px;
  border-radius:14px;
}

.invite-card h2{
  margin-bottom:11px;
  font-size:17px;
}

.invite-link{
  min-height:50px;
  padding:9px;
  font-size:13px;
  border-radius:7px;
}

.invite-buttons{
  gap:7px;
  margin-top:9px;
}

.invite-buttons button{
  min-height:44px;
  border-width:1px;
  border-radius:11px;
  font-size:14px;
}

.qr-box{
  width:220px;
  max-width:75%;
  margin:14px auto;
  padding:10px;
  border-radius:18px;
}

.qr-card p{
  margin:12px auto 2px;
  font-size:13px;
  line-height:1.35;
}

@media(max-width:390px){
  .invite-header{
    height:54px;
  }

  .invite-header h1{
    font-size:19px;
  }

  .back-btn{
    width:43px;
    height:43px;
    font-size:28px;
  }

  .invite-card{
    max-width:350px;
    margin:12px auto;
    padding:13px 10px;
  }

  .invite-card h2{
    font-size:16px;
  }

  .invite-link{
    font-size:12px;
  }

  .invite-buttons button{
    min-height:41px;
    font-size:13px;
  }

  .qr-box{
    width:205px;
  }

  .qr-card p{
    font-size:12px;
  }
}
</style>
