<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NILE AI HUB - Login</title><style>body{background:#000103!important;background-image:radial-gradient(rgba(10,204,246,.28) 1px,transparent 1px)!important;background-size:20px 20px!important;background-attachment:fixed!important}body{margin:0;background:#03070b;color:#fff;font-family:Arial,sans-serif}.box{max-width:430px;margin:70px auto;padding:24px}.logo{text-align:center;color:#0ACCF6;font-size:28px;font-weight:800;margin-bottom:35px}.card{background:#09131d;border:1px solid #164858;border-radius:20px;padding:22px}.input{width:100%;box-sizing:border-box;padding:15px;margin:8px 0;background:#05090e;color:#fff;border:1px solid #28505d;border-radius:12px}.btn{width:100%;padding:15px;margin-top:12px;background:#00B7FF;border:0;border-radius:12px;font-weight:bold;color:#001015}.link{display:block;text-align:center;margin-top:18px;color:#0ACCF6;text-decoration:none}</style><link rel="stylesheet" href="{{ url_for("static",filename="css/nile-waves.css") }}"></head><body><canvas id="nileWaveCanvas" aria-hidden="true"></canvas><script src="{{ url_for("static",filename="js/nile-waves.js") }}"></script><div class="box"><div class="logo">NILE AI HUB</div><div class="card"><h1>Welcome Back</h1>{% if error %}<div style="background:#3b0a0a;color:#ff5c5c;border:1px solid #ff3b3b;padding:11px;border-radius:10px;margin-bottom:12px">{{ error }}</div>{% endif %}{% if success %}<div style="background:#063d24;color:#45ff9a;border:1px solid #20c879;padding:11px;border-radius:10px;margin-bottom:12px">{{ success }}</div>{% if redirect_home %}<script>setTimeout(function(){location.href="/home"},900)</script>{% endif %}{% endif %}<form method="post" action="/login" onsubmit="this.querySelector(\"button\").disabled=true;this.querySelector(\"button\").textContent=\"LOGGING IN...\";return true;"><input class="input" name="phone" placeholder="Phone Number" required><input class="input" type="password" name="password" placeholder="Password" required><button class="btn" type="submit">LOGIN</button></form><a class="link" href="/register">Create a new account</a></div></div></body></html>
