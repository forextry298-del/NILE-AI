<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NILE AI HUB - My</title><style>body{margin:0;background:#03070b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.logo{color:#18dfff;font-size:27px;font-weight:800;margin-bottom:25px}.card{background:#09131d;border:1px solid #164858;border-radius:18px;padding:20px;margin-bottom:14px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #12303b}.value{color:#19ddff}.btn{display:block;text-align:center;background:#16d8f5;color:#001015;padding:14px;border-radius:12px;font-weight:bold;margin-top:15px}.back{display:block;text-align:center;color:#19ddff;padding:15px}</style></head><body><div class="wrap"><div class="logo">NILE AI HUB</div><div class="card"><h1>My Profile</h1><div class="row"><span>Nickname</span><span class="value">{{ user.nickname or "Member" }}</span></div><div class="row"><span>Phone</span><span class="value">{{ user.phone }}</span></div><div class="row"><span>Points</span><span class="value">{{ user.points }}</span></div></div><div class="card"><h2>Account</h2><a class="btn" href="/logout">SIGN OUT</a></div><a class="back" href="/home">← Back to Home</a></div></body></html>
