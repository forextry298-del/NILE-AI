<section class="auth-card"><div class="robot-zone" aria-hidden="true"></div><div class="auth-logo">NILE<span>AI</span></div><small>AI COMMAND CENTER</small><h2>Create Account</h2><p>Join the  network.</p><form method="post"><input class="auth-input" name="phone" placeholder="Phone Number" required><input class="auth-input" type="password" name="password" placeholder="Set Password" required><input class="auth-input" type="password" name="confirm" placeholder="Confirm Password" required><div class="captcha-row"><input class="auth-input" name="captcha_input" placeholder="Verification code" required><span>{{real_captcha}}</span></div><input type="hidden" name="real_captcha" value="{{real_captcha}}"><input class="auth-input" name="invite" value="{{invite}}" placeholder="Invitation Code"><button class="auth-btn" type="submit">CREATE ACCOUNT</button></form><div class="auth-links"><a href="/login">Already have an account?</a></div></section>{% endblock %}
