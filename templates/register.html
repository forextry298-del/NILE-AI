<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NILE AI HUB - Register</title><style>body{background:#000103!important;background-image:radial-gradient(rgba(10,204,246,.28) 1px,transparent 1px)!important;background-size:20px 20px!important;background-attachment:fixed!important}body{margin:0;background:#03070b;color:#fff;font-family:Arial,sans-serif}.box{max-width:430px;margin:70px auto;padding:24px}.logo{text-align:center;color:#0ACCF6;font-size:28px;font-weight:800;margin-bottom:35px}.card{background:#09131d;border:1px solid #164858;border-radius:20px;padding:22px}.input{width:100%;box-sizing:border-box;padding:15px;margin:8px 0;background:#05090e;color:#fff;border:1px solid #28505d;border-radius:12px}.btn{width:100%;padding:15px;margin-top:12px;background:#00B7FF;border:0;border-radius:12px;font-weight:bold;color:#001015}.link{display:block;text-align:center;margin-top:18px;color:#0ACCF6;text-decoration:none}</style></head><body><div class="box"><div class="logo">NILE AI HUB</div><div class="card"><h1>Create Account</h1>{% if error %}<div style="background:#063d24;color:#45ff9a;border:1px solid #20c879;padding:11px;border-radius:10px;margin-bottom:12px">{{ error }}</div>{% endif %}<form method="post"><input class="input" name="nickname" placeholder="Nickname"><input class="input" name="phone" placeholder="Phone Number" required><input class="input" type="password" name="password" placeholder="Set Password (8+ chars, upper/lowercase & number)" required><input class="input" type="password" name="confirm_password" placeholder="Repeat Password" required><button class="btn">REGISTER</button></form><a class="link" href="/login">Already have an account? Login</a></div></div></body></html>
