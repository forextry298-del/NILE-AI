{% extends 'base.html' %}{% block content %}<section class="section nile-password-panel"><h2>Change password</h2><p class="nile-password-note">Use at least 8 characters for your new password.</p><form method="post" action="/account" autocomplete="off"><input type="hidden" name="action" value="change_password"><label for="current_password">Current password</label><div class="field"><input id="current_password" name="current_password" type="password" placeholder="Current password" autocomplete="current-password" required></div><label for="new_password">New password</label><div class="field"><input id="new_password" name="new_password" type="password" minlength="8" placeholder="At least 8 characters" autocomplete="new-password" required></div><label for="confirm_password">Confirm new password</label><div class="field"><input id="confirm_password" name="confirm_password" type="password" minlength="8" placeholder="Repeat new password" autocomplete="new-password" required></div><button class="nile-password-button" type="submit">Update password</button></form></section><a class="nile-signout-button" href="/logout">⇥ Sign out</a><style>.nile-password-panel{box-sizing:border-box;width:100%;margin:14px auto;padding:14px 12px;border:1px solid #16d9ff;border-radius:16px;background:rgba(3,9,15,.94);box-shadow:0 0 10px rgba(22,217,255,.12)}.nile-password-panel h2{margin:0 0 8px;color:#16d9ff;font-size:17px}.nile-password-note{margin:0 0 12px;color:#9aabba;font-size:11px}.nile-password-panel label{display:block;margin:10px 0 5px;color:#ffd34d;font-size:12px}.nile-password-panel .field{margin:0 0 8px;padding:0;min-height:0}.nile-password-panel input{box-sizing:border-box;width:100%;min-width:0;padding:11px 10px;border:1px solid #174455;border-radius:10px;background:#05090d;color:#fff;font-size:13px}.nile-password-button{display:block;width:100%;margin-top:12px;padding:11px;border:1px solid #16d9ff;border-radius:11px;background:linear-gradient(90deg,#16d9ff,#ffd34d);color:#071019;font-weight:700;font-size:13px}.nile-signout-button{box-sizing:border-box;display:block;width:100%;margin:12px auto 20px;padding:11px;text-align:center;text-decoration:none;border:1px solid #ff3151;border-radius:12px;background:rgba(30,3,10,.65);color:#ff3151;font-size:13px;font-weight:700}</style><div class="title">Settings</div><form method="post"><div class="section"><h2>Profile</h2><label>Display name</label><div class="field"><input name="display_name" value="{{user.display_name}}"></div><p class="muted">Phone: {{user.phone}}</p></div><div class="section"><h2>Payout details</h2><div class="field"><input name="mtn_number" value="{{user.mtn_number}}" placeholder="MTN Uganda number"></div><div class="field"><input name="airtel_number" value="{{user.airtel_number}}" placeholder="Airtel Uganda number"></div><div class="field"><input name="usdt_wallet" value="{{user.usdt_wallet}}" placeholder="USDT TRC20 address"></div></div><div class="section"><h2>Notifications</h2><label><input type="checkbox" name="notifications" {% if user.notifications_enabled %}checked{% endif %} style="width:auto"> Push & in-app notifications</label></div><button class="button primary">Save changes</button></form>{% endblock %}
