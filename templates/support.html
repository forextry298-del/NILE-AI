{% extends 'base.html' %}{% block content %}<div class="nile-wrap"><header class="nile-header"><div><div class="nile-brand">NILE AI</div><div class="nile-sub">SUPPORT CHAT</div></div><div class="nile-avatar">✉</div></header><div class="section-title">Chats</div><div class="section">{% for m in messages %}<p><b>{{m.sender}}</b>: {{m.message}}</p><small class="muted">{{m.created_at}}</small><hr>{% else %}<p class="muted">No messages yet.</p>{% endfor %}</div><form method="post"><div class="field"><input name="message" placeholder="Write a message..." required></div><button class="button">Send</button></form>{% endblock %}
