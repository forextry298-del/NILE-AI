<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NILE AI HUB - Tasks</title><style>body{margin:0;background:#03070b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.logo{color:#18dfff;font-size:27px;font-weight:800;margin-bottom:25px}.card{background:#09131d;border:1px solid #164858;border-radius:18px;padding:18px;margin-bottom:14px}.task{background:#071019;border:1px solid #123d4c;border-radius:15px;padding:18px;margin:10px 0}.points{color:#19ddff;font-weight:bold}.back{display:block;text-align:center;color:#19ddff;padding:15px}</style></head><body><div class="wrap"><div class="logo">NILE AI HUB</div><div class="card"><h1>Daily Tasks</h1><p>Complete tasks and collect points.</p>{% for task in tasks %}<div class="task"><b>{{ task.name }}</b><p class="points">+{{ task.points }} points</p></div>{% endfor %}</div><a class="back" href="/home">← Back to Home</a></div></body></html>
